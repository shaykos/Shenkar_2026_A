<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch</title>
    <script type="module" src="./scripts/main.js"></script>
</head>
<body>
    <h1>Fetch</h1>
    <p>Click the button to fetch data from an API.</p>
    <input type="number" id="limit" placeholder="Enter number of items to fetch" />
    <button id="fetch-btn">Fetch Data</button>
    <div id="result"></div>

    <hr>
    
    <h2>Autocomplete</h2>
    <input type="text" id="autocomplete-input" placeholder="Start typing..." list="autocomplete-list" />
    <datalist id="autocomplete-list"></datalist>
</body>
</html>
